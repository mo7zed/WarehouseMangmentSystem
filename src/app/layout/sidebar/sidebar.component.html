<aside class="wms-sidebar" [class.collapsed]="isCollapsed() && !mobileMenuOpen()" [class.mobile-open]="mobileMenuOpen()">
      <!-- Logo -->
      <div class="sidebar-logo">
        <img class="brand-wordmark" src="assets/brand/tachyon-logo.png" alt="Tachyon" width="245" height="59" />
<img class="brand-mark" src="assets/brand/tachyon-mark.png" alt="Tachyon" width="36" height="36" />
<button class="sidebar-toggle" (click)="toggleSidebar()" [attr.aria-label]="'APP.TOGGLE_NAV' | translate" id="sidebar-toggle-btn">
<i class="pi" [class.pi-chevron-left]="(!isCollapsed() || mobileMenuOpen())" [class.pi-chevron-right]="isCollapsed()"></i>
</button></div>
<!-- Navigation -->
      <nav class="sidebar-nav">
        <div class="nav-section" *ngIf="(!isCollapsed() || mobileMenuOpen())">
          <span class="nav-section-label">{{ 'APP.MAIN_MENU' | translate }}</span>
        </div>

        <ul class="nav-list">
          <li *ngFor="let item of navItems">
            <a
              class="nav-item"
              [routerLink]="item.route" (click)="closeMobileMenu()"
              routerLinkActive="active"
              [pTooltip]="isCollapsed() ? (item.label | translate) : ''"
              [tooltipPosition]="isRTL() ? 'left' : 'right'"
              [id]="'nav-' + item.id" [attr.aria-label]="item.label | translate"
            >
              <i class="nav-icon pi" [class]="item.icon"></i>
              <span class="nav-label" *ngIf="(!isCollapsed() || mobileMenuOpen())">{{ item.label | translate }}</span>
              <span class="nav-badge" *ngIf="item.badge && (!isCollapsed() || mobileMenuOpen())">{{ item.badge }}</span>
            </a>

            <!-- Sub items -->
            <ul class="nav-sub-list" *ngIf="item.children && (!isCollapsed() || mobileMenuOpen())" [class.expanded]="isItemExpanded(item.id)">
              <li *ngFor="let child of item.children">
                <a
                  class="nav-sub-item"
                  [routerLink]="child.route" (click)="closeMobileMenu()"
                  routerLinkActive="active"
                  [id]="'nav-' + child.id"
                >
                  <i class="pi pi-minus nav-sub-icon"></i>
                  <span>{{ child.label | translate }}</span>
                </a>
              </li>
            </ul>
          </li>
        </ul>

        <!-- Bottom Nav -->
        <div class="sidebar-footer">
          <a
            class="nav-item"
            routerLink="/settings" (click)="closeMobileMenu()"
            routerLinkActive="active"
            [pTooltip]="isCollapsed() ? ('NAV.SETTINGS' | translate) : ''"
            [tooltipPosition]="isRTL() ? 'left' : 'right'"
            id="nav-settings"
          >
            <i class="nav-icon pi pi-cog"></i>
            <span class="nav-label" *ngIf="(!isCollapsed() || mobileMenuOpen())">{{ 'NAV.SETTINGS' | translate }}</span>
          </a>
          <a
            class="nav-item"
            routerLink="/admin" (click)="closeMobileMenu()"
            routerLinkActive="active"
            [pTooltip]="isCollapsed() ? ('NAV.ADMIN' | translate) : ''"
            [tooltipPosition]="isRTL() ? 'left' : 'right'"
            id="nav-admin"
          >
            <i class="nav-icon pi pi-shield"></i>
            <span class="nav-label" *ngIf="(!isCollapsed() || mobileMenuOpen())">{{ 'NAV.ADMIN' | translate }}</span>
          </a>
        </div>
      </nav>
    </aside>
